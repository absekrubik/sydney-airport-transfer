<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="A plane flying over Sydney while a car drives to the airport" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.c1{animation:drift 50s linear infinite} .c2{animation:drift 70s linear infinite;animation-delay:-28.0s}
.c3{animation:drift 60s linear infinite;animation-delay:-45.0s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(820px)}}
.plane{offset-path:path('M-40 250 C 160 60, 420 40, 760 140');offset-rotate:auto;animation:fly 22s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.trail{stroke-dasharray:3 10;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.car{animation:drive 14s linear infinite}
@keyframes drive{from{transform:translateX(-170px)}to{transform:translateX(780px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
</style>
